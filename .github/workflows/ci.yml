name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LibrarySystem.sln -m:1
      - name: Build
        run: dotnet build LibrarySystem.sln --configuration Release --no-restore -m:1
      - name: Test
        run: dotnet test tests/LibrarySystem.Tests/LibrarySystem.Tests.csproj --configuration Release --no-build --no-restore
